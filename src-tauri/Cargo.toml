[package]
name = "wwm-midi-project"
version = "1.1.9"
description = "Local MIDI player and creator for WWM Midi Project"
authors = ["WWM Midi Project"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
midly = "0.5"
enigo = "0.2"
lazy_static = "1.4"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
tauri-plugin-dialog = "2.4.2"
xcap = "0.0.14"
image = "0.25"
open = "5"
ureq = "2"
base64 = "0.22"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
zip = "2"
log = "0.4"
simplelog = "0.12"
rayon = "1.10"
midir = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "wwm-midi-project"
path = "src/main.rs"

[profile.release]
# Optimize shipped builds for runtime behavior while keeping CI build time reasonable.
opt-level = 3
codegen-units = 16
lto = "thin"
strip = true
