name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Audit album metadata
        run: bun run album:audit

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust build
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Build Tauri app
        run: bun run tauri-build

      - name: Create album folder next to executable
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release"
          New-Item -Path "$bundlePath/album" -ItemType Directory -Force
          Write-Host "Created album folder at $bundlePath/album"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $releasePath = "src-tauri/target/release"
          $files = @()
          $files += Get-Item "$releasePath/wwm-midi-project.exe"
          if (Test-Path "$releasePath/bundle") {
            $files += Get-ChildItem "$releasePath/bundle" -Recurse -File -Include *.exe,*.msi
          }
          $files | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), ($_.FullName.Replace((Resolve-Path $releasePath).Path + "\", ""))
          } | Set-Content "$releasePath/checksums.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wwm-midi-project-windows
          path: |
            src-tauri/target/release/wwm-midi-project.exe
            src-tauri/target/release/album/
            src-tauri/target/release/checksums.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/wwm-midi-project.exe
            src-tauri/target/release/checksums.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## Installation
            1. Download the installer or `wwm-midi-project.exe`.
            2. Keep an `album` folder next to the executable for MIDI files.
            3. Run the app as Administrator when keyboard input needs to reach the game.

            ## Integrity
            Verify downloads with `checksums.sha256`.

            ## What's New
            See commits for changes in this release.
