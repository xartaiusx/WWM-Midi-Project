name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: .\scripts\dev.cmd bun install --frozen-lockfile

      - name: Run frontend tests
        run: .\scripts\dev.cmd bun run test

      - name: Build frontend
        run: .\scripts\dev.cmd bun run build

      - name: Audit album metadata
        run: .\scripts\dev.cmd bun run album:audit

      - name: Check Rust formatting
        run: .\scripts\dev.cmd cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust build
        run: .\scripts\dev.cmd cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust clippy
        run: .\scripts\dev.cmd cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
