name: Bug report
description: Report a reproducible app, build, playback, or workflow problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep WWM Midi Project reliable. Do not attach private MIDI files, recordings, tokens, or machine-specific diagnostics.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest steps that reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.9 or commit SHA
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I did not attach copyrighted/private MIDI files, recordings, tokens, or sensitive diagnostics.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
